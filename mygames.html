<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>My Games</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgb(8, 12, 30);

      font-family: Arial, sans-serif;

      padding: 0;
    }

    .space-bg {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;
      z-index: 0;

      background:
        linear-gradient(145deg,
          rgb(8, 12, 30),
          rgb(20, 30, 65));
    }

    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .asteroid {
      position: absolute;

      width: 28px;
      height: 20px;

      background: rgba(185, 190, 205, 0.55);

      border: 1px solid rgba(235, 240, 255, 0.3);

      border-radius: 45% 55% 50% 40%;

      box-shadow:
        inset -5px -4px 7px rgba(45, 50, 75, 0.35),
        inset 3px 2px 5px rgba(255, 255, 255, 0.12),
        0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .asteroid::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 4px;

      left: 30%;
      top: 28%;

      border-radius: 50%;

      background: rgba(55, 60, 85, 0.35);

      box-shadow:
        9px 5px 0 rgba(55, 60, 85, 0.2);
    }

    @keyframes asteroidMove {
      from {
        transform: translate(-100px, -80px) rotate(0deg);
      }

      to {
        transform: translate(1150px, 450px) rotate(360deg);
      }
    }

    @keyframes asteroidMove2 {
      from {
        transform: translate(-150px, 120px) rotate(0deg);
      }

      to {
        transform: translate(1000px, -300px) rotate(-360deg);
      }
    }

    @keyframes asteroidMove3 {
      from {
        transform: translate(200px, -100px) rotate(0deg);
      }

      to {
        transform: translate(-900px, 500px) rotate(360deg);
      }
    }

    .a1 {
      top: 5%;
      left: -5%;
      animation: asteroidMove 28s linear infinite;
    }

    .a2 {
      top: 20%;
      left: 10%;
      animation: asteroidMove 34s linear infinite;
      animation-delay: -10s;
    }

    .a3 {
      top: 35%;
      left: -8%;
      animation: asteroidMove 31s linear infinite;
      animation-delay: -18s;
    }

    .a4 {
      top: 55%;
      left: 5%;
      animation: asteroidMove 40s linear infinite;
      animation-delay: -5s;
    }

    .a5 {
      top: 75%;
      left: -3%;
      animation: asteroidMove 36s linear infinite;
      animation-delay: -22s;
    }

    .a6 {
      top: 0%;
      left: 35%;
      animation: asteroidMove2 38s linear infinite;
      animation-delay: -12s;
    }

    .a7 {
      top: 25%;
      left: 45%;
      animation: asteroidMove2 32s linear infinite;
      animation-delay: -7s;
    }

    .a8 {
      top: 50%;
      left: 55%;
      animation: asteroidMove2 41s linear infinite;
      animation-delay: -20s;
    }

    .a9 {
      top: 10%;
      left: 70%;
      animation: asteroidMove3 35s linear infinite;
      animation-delay: -15s;
    }

    .a10 {
      top: 40%;
      left: 80%;
      animation: asteroidMove3 29s linear infinite;
      animation-delay: -2s;
    }

    .a11 {
      top: 65%;
      left: 65%;
      animation: asteroidMove3 43s linear infinite;
      animation-delay: -25s;
    }

    .a12 {
      top: 80%;
      left: 85%;
      animation: asteroidMove3 33s linear infinite;
      animation-delay: -11s;
    }

    .a2,
    .a7,
    .a10 {
      width: 14px;
      height: 10px;
    }

    .a3,
    .a8 {
      width: 38px;
      height: 28px;
    }

    .a5,
    .a11 {
      width: 22px;
      height: 16px;
    }

    .a6 {
      width: 46px;
      height: 32px;
    }

    .menu {
      position: relative;
      z-index: 1;

      width: min(1200px, calc(100vw - 80px));

      background: transparent;
      border: none;
      box-shadow: none;

      padding: 40px 20px;

      text-align: center;

      overflow: hidden;
    }

    h1,
    .games {
      position: relative;
      z-index: 1;
    }

    .games {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 35px;

      position: relative;
      z-index: 2;
    }

    #snake {
      top: -45px;
      animation-delay: 0s;
      animation-duration: 2.2s;
    }

    #doodlejump {
      top: 45px;
      animation-delay: -1.3s;
      animation-duration: 2.6s;
    }

    #brick-breaker {
      top: -45px;
      animation-delay: -2.4s;
      animation-duration: 2.3s;
    }

    #flappybird {
      top: 45px;
      animation-delay: -3.1s;
      animation-duration: 2.4s;
    }

    @keyframes floatCard {
      0% {
        translate: 0 -6px;
      }

      50% {
        translate: 0 6px;
      }

      100% {
        translate: 0 -6px;
      }
    }

    @media (max-width: 900px) {
      .games {
        flex-wrap: wrap;
      }

      #snake,
      #doodlejump,
      #brick-breaker,
      #flappybird {
        top: 0;
      }
    }

    h1 {
      margin-top: 0;
      margin-bottom: 70px;

      color: #f4f7fb;
      font-size: 30px;
      letter-spacing: 0.5px;

      position: relative;
      z-index: 3;
    }

    .game-card {
      position: relative;

      width: 320px;
      height: 320px;

      margin: 0;
      padding: 0;

      border-radius: 12px;
      overflow: hidden;

      border: 2px solid rgba(255, 255, 255, 0.22);
      background: transparent;

      animation: floatCard 5s ease-in-out infinite;

      transition:
        transform 180ms ease,
        border-color 180ms ease;
    }

    .game-card:hover {
      transform: scale(1.025);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .demo-wrapper {
      width: 320px;
      height: 320px;
      overflow: hidden;
    }

    .game-card,
    .demo-wrapper {
      width: 270px;
      height: 270px;
    }

    .game-demo {
      width: 400px;
      height: 400px;

      display: block;

      border: none;

      pointer-events: none;

      transform: scale(0.675);
      transform-origin: top left;

      transition: filter 180ms ease;
    }

    .play-overlay {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #243b6b;
      color: #f4f7fb;

      border-radius: 15%;

      opacity: 0;
      pointer-events: none;

      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.18);

      transition:
        opacity 180ms ease,
        transform 180ms ease,
        background 180ms ease;
    }

    .play-overlay svg {
      width: 28px;
      height: 28px;
    }

    .game-card:hover .play-overlay {
      opacity: 1;
      pointer-events: auto;

      transform: translate(-50%, -55%);
    }

    .play-overlay:hover {
      background: #006aff;
    }

    .game-card:hover .game-demo {
      filter: brightness(0.72);
    }

    #doodlejumpdemo {
  width: 400px;
  height: 533px;

  transform:
    translateY(-65px)
    scale(0.675);

  transform-origin: top left;
}

#flappybirddemo {
  width: 600px;
  height: 400px;

  transform:
    translateX(-50px)
    scale(0.675);

  transform-origin: top left;
}
  </style>
</head>

<body>

  <div class="space-bg">
    <div class="stars"></div>
    <span class="asteroid a1"></span>
    <span class="asteroid a2"></span>
    <span class="asteroid a3"></span>
    <span class="asteroid a4"></span>
    <span class="asteroid a5"></span>
    <span class="asteroid a6"></span>
    <span class="asteroid a7"></span>
    <span class="asteroid a8"></span>
    <span class="asteroid a9"></span>
    <span class="asteroid a10"></span>
    <span class="asteroid a11"></span>
    <span class="asteroid a12"></span>
  </div>

  <div class="menu">
    <h1>My Games</h1>

    <div class="games">

      <div class="game-card" id="snake">
        <div class="demo-wrapper">
          <iframe class="game-demo" src="snek/snake.html?demo=true" scrolling="no">
          </iframe>
        </div>
        <a class="play-overlay" href="snek/snake.html" aria-label="Play Snake">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </a>
      </div>

      <div class="game-card" id="doodlejump">
        <div class="demo-wrapper">
          <iframe class="game-demo" id="doodlejumpdemo" src="jumper/doodlejump.html?demo=true" scrolling="no">
          </iframe>
        </div>
        <a class="play-overlay" href="jumper/doodlejump.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </a>
      </div>

      <div class="game-card" id="brick-breaker">
        <div class="demo-wrapper">
          <iframe class="game-demo" src="brick-breaker/brick-breaker.html?demo=true" scrolling="no">
          </iframe>
        </div>

        <a class="play-overlay" href="brick-breaker/brick-breaker.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </a>
      </div>

      <div class="game-card" id="flappybird">
        <div class="demo-wrapper">
          <iframe class="game-demo" id="flappybirddemo" src="flappybird/flappybird.html?demo=true" scrolling="no">
          </iframe>
        </div>

        <a class="play-overlay" href="flappybird/flappybird.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </a>
      </div>

    </div>
  </div>

  <script>

    const starsContainer = document.querySelector(".stars");
    const stars = [];

    for (let i = 0; i < 120; i++) {
      const star = document.createElement("span");

      star.style.position = "absolute";

      const x = Math.random() * 100;
      const y = Math.random() * 100;

      star.style.left = x + "%";
      star.style.top = y + "%";

      star.style.borderRadius = "50%";

      const size = Math.random() * 1.5 + 1;

      star.style.width = size + "px";
      star.style.height = size + "px";

      if (size > 2) {
        star.style.width = size * 2.5 + "px";
        star.style.borderRadius = "999px";
      }

      star.style.background = "white";

      star.style.opacity =
        Math.random() * 0.25 + 0.7;

      star.style.boxShadow =
        "0 0 5px rgba(255,255,255,0.95)";

      if (Math.random() < 0.3) {
        star.style.width = "3px";
        star.style.height = "3px";

        star.style.opacity = "1";

        star.style.boxShadow =
          "0 0 8px rgba(210,225,255,1)";
      }

      starsContainer.appendChild(star);

      stars.push({
        element: star,
        x: x,
        y: y,
        speed: Math.random() * 0.25 + 0.25
      });
    }

    function moveStars() {

      for (let i = 0; i < stars.length; i++) {
        const star = stars[i];

        star.x -= star.speed;

        if (star.x < 0) {
          star.x = 100;
          star.y = Math.random() * 100;
        }

        star.element.style.left = star.x + "%";
        star.element.style.top = star.y + "%";
      }

      requestAnimationFrame(moveStars);
    }

    moveStars();

  </script>

</body>

</html>
